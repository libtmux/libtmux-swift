# The tooling in this directory is Python, and this is the configuration it is
# held to. It sits here rather than at the repository root because that is where
# the Python is: ruff walks up from each file it checks, so a config beside the
# code it governs needs no `--config` at any call site.
#
# Carried over from libtmux for Python, so a change made in one port reads the
# same in the other.
target-version = "py310"

[lint]
# `select` is deliberately unset: ruff enables a curated default rule set, and
# an explicit `select` would replace it rather than extend it.
extend-select = [
  "E",      # pycodestyle
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "A",      # flake8-builtins
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "COM",    # flake8-commas
  "EM",     # flake8-errmsg
  "Q",      # flake8-quotes
  "PTH",    # flake8-use-pathlib
  "SIM",    # flake8-simplify
  "TRY",    # tryceratops
  "PERF",   # perflint
  "RUF",    # ruff-specific rules
  "D",      # pydocstyle
  "FA100",  # future annotations
]
ignore = [
  "COM812", # missing trailing comma, conflicts with the formatter
]

[lint.isort]
combine-as-imports = true
required-imports = [
  "from __future__ import annotations",
]

[lint.flake8-builtins]
builtins-allowed-modules = [
  "dataclasses",
  "types",
]

[lint.pydocstyle]
convention = "numpy"

[lint.per-file-ignores]
# `mcp_swap.py` is kept identical to the copies in the other libtmux
# repositories, so a rule it does not satisfy is turned off here rather than
# patched into one copy and not the others. Its blind `except` is a rollback
# path: it restores the original bytes after any failure at all, which is the
# one place catching everything is the point.
"mcp_swap.py" = ["BLE001"]
