# Tooling for the support scripts under scripts/. The Swift package has no
# Python dependency and does not build or install this project: this file holds
# the checks that govern scripts/ and the dependency group that runs them. Each
# script declares its own dependencies inline (PEP 723) and runs with
# `uv run scripts/<name>/<script>.py`.
[project]
name = "libtmux-swift-scripts"
version = "0"
description = "Format, lint, type and test configuration for scripts/"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "ruff>=0.17",
  "ty>=0.0.101",
]

[tool.uv]
package = false
# Lock only releases at least three days old, so a release that broke a rule
# or a check is not the one CI picks up on its first day. A project setting
# overrides a contributor's own uv configuration, so `uv lock --check` gives the
# same answer on every machine. A relative value needs uv 0.9.17 or newer.
exclude-newer = "3 days"

[tool.pytest.ini_options]
testpaths = ["scripts"]
# A test that imports its script by name finds it here.
pythonpath = [
  "scripts/check_workspace",
  "scripts/ci_plan",
  "scripts/swift_test",
  "scripts/update_mode_matrix",
]
addopts = [
  "--doctest-modules",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-p",
  "no:cacheprovider",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# `select` is deliberately unset: ruff enables a curated default rule set, and
# an explicit `select` would replace it rather than extend it.
extend-select = [
  "E",      # pycodestyle
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "A",      # flake8-builtins
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "COM",    # flake8-commas
  "EM",     # flake8-errmsg
  "Q",      # flake8-quotes
  "PTH",    # flake8-use-pathlib
  "SIM",    # flake8-simplify
  "TRY",    # tryceratops
  "PERF",   # perflint
  "RUF",    # ruff-specific rules
  "D",      # pydocstyle
  "ANN",    # flake8-annotations
  "C901",   # mccabe complexity
  "PLR0915", # pylint too-many-statements
]
ignore = [
  "COM812", # missing trailing comma, conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests build JSON documents from literals, which `Any` types honestly.
"scripts/**/tests/*.py" = ["ANN401"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"
extra-paths = [
  "scripts/check_workspace",
  "scripts/ci_plan",
  "scripts/swift_test",
  "scripts/update_mode_matrix",
]

[tool.ty.src]
include = ["scripts"]
