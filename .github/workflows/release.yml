name: release

# A tag is the release: SwiftPM resolves a package from its git history, and
# nothing is uploaded anywhere. What this adds is the part every established
# Swift package has and a tag alone does not — a GitHub Release carrying the
# notes for that version, marked prerelease while the version says it is one.
#
# The tag is pushed by hand. This refuses one that disagrees with
# `LibTmuxVersion.current` or that the changelogs do not describe, so a
# mistyped tag fails here rather than becoming a version somebody depends on.
#
# Runnable by hand as a dry run, which checks the version and the notes without
# publishing anything. A release path that has never been executed is one whose
# first execution is the release.

permissions:
  contents: read

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the version and notes without creating a release
        type: boolean
        default: true

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      # A dry run has no tag to read, so it checks the version the package
      # declares, which is the one a tag would have to match anyway.
      - name: Resolve the version under release
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: uv run scripts/check_version/check_version.py --release "$REF_TYPE" "$REF_NAME"

      # From this version's heading to the next one in the root changelog,
      # then in each product's, so the notes are the sections a reader of
      # those files already has. The script refuses a version any of them
      # has no section for, and a release that says nothing anywhere.
      - name: Take the notes from the changelogs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run scripts/changelogs/changelogs.py notes "$VERSION" > notes.md

      - name: Show the notes
        run: cat notes.md

      - name: Create the release
        if: github.ref_type == 'tag' && !contains(steps.version.outputs.version, '-')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$VERSION"
          --title "$VERSION"
          --notes-file notes.md
          --verify-tag

      # A version with a prerelease suffix is marked as one, which keeps it out
      # of "latest" for a reader arriving at the repository. Semver spells that
      # with a hyphen.
      - name: Create the prerelease
        if: github.ref_type == 'tag' && contains(steps.version.outputs.version, '-')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$VERSION"
          --title "$VERSION"
          --notes-file notes.md
          --verify-tag
          --prerelease

      - name: Say what a dry run skipped
        if: github.ref_type != 'tag'
        run: echo "Dry run - the version and notes check out; nothing published."
