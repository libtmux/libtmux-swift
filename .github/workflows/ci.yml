name: ci

# Pull requests already test their head commit. Running every branch push too
# duplicates the real-tmux jobs and makes both suites compete for runners.
#
# A push or pull request tests the oldest and newest released tmux. A tag, which
# is a release, and a dispatch with `scope: full` test the whole table, the
# pinned master and the releases the library refuses. Scripts/tmux-matrix.json
# is the one list, and `plan` turns it into the matrices below.
on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "edges: the oldest and newest released tmux. full: the whole table, master and the refusal cells. custom: the tmux-ref and swift below."
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: "With scope custom: comma-separated tmux releases, tags, branches or 40-hex commits from github.com/tmux/tmux, for example 3.6b,master."
        type: string
        default: ""
      swift:
        description: "Comma-separated Swift toolchains for the test job, for example 6.1,6.2. Empty is the pinned toolchain."
        type: string
        default: ""
      tmate:
        description: "Open a tmate session on the one test leg. Needs scope custom with a single tmux-ref."
        type: choice
        options: ['off', before-tests, on-failure]
        default: 'off'

concurrency:
  # A dispatch asks for one particular permutation, so it must not cancel the
  # push run on its branch or another dispatch on it. Pushes still supersede
  # each other.
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # The tmux axis of both matrices, from Scripts/tmux-matrix.json and the
  # event. The plan also fails a dispatch that asks for something CI will not
  # do before any runner is spent on it.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      test: ${{ steps.plan.outputs.test }}
      refusal: ${{ steps.plan.outputs.refusal }}
      refusal_planned: ${{ steps.plan.outputs.refusal_planned }}
      tmux_jobs: ${{ steps.plan.outputs.tmux_jobs }}

    steps:
      - uses: actions/checkout@v7

      - name: Plan the tmux matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          SWIFT: ${{ inputs.swift }}
          TMATE: ${{ inputs.tmate }}
        run: |
          python3 Scripts/ci_plan.py matrix \
            --event "$EVENT" --ref-type "$REF_TYPE" --scope "$SCOPE" \
            --tmux-ref "$TMUX_REF" --swift "$SWIFT" --tmate "$TMATE" \
            --github-output "$GITHUB_OUTPUT"

  # The releases the library refuses. Each is built from its own tag and run
  # against only the version check suites: the claim is that a daemon below the
  # floor is refused before any command has an effect, which the rest of the
  # suite cannot say because it would be refused too. They are part of the
  # whole table, so only a tag and a full-scope dispatch run them.
  refusal:
    name: ubuntu-latest / tmux ${{ matrix.tmux }} (refused)
    needs: plan
    if: needs.plan.outputs.refusal_planned == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.refusal) }}

    steps:
      - uses: actions/checkout@v7

      # tmux 3.0a and 3.1c link the full libevent, which the runner image does
      # not carry, and a cached build installs nothing else.
      - name: Install the libevent runtime
        run: |
          ./Scripts/apt-get.sh update
          ./Scripts/apt-get.sh install --yes --no-install-recommends libevent-2.1-7t64

      - name: Restore tmux ${{ matrix.tmux }}
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-${{ matrix.tmux }}
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install build dependencies
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          ./Scripts/apt-get.sh update
          ./Scripts/apt-get.sh install --yes --no-install-recommends \
            bison libevent-dev libncurses-dev pkg-config

      - name: Build tmux ${{ matrix.tmux }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ matrix.tmux }}
        run: |
          python3 Scripts/tmux_ref.py build --source release \
            --ref "$VERSION" --prefix "$HOME/tmux-$VERSION"

      # tmux 3.0a and 3.1c keep the client's stdout open from the daemon, so
      # the refusal also runs with a client that is at the floor: the old
      # binary as its own client only exercises the client rejecting -N.
      - name: Restore the tmux ${{ matrix.client }} client
        id: client-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-${{ matrix.client }}
          key: tmux-${{ matrix.client }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build the tmux ${{ matrix.client }} client
        if: steps.client-cache.outputs.cache-hit != 'true'
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          ./Scripts/apt-get.sh update
          ./Scripts/apt-get.sh install --yes --no-install-recommends \
            bison libevent-dev libncurses-dev pkg-config
          python3 Scripts/tmux_ref.py build --source release \
            --ref "$CLIENT" --prefix "$HOME/tmux-$CLIENT"

      - name: Restore the SwiftPM cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-linux-${{ hashFiles('Package.resolved', 'Examples/Package.resolved', 'Tools/McpSwap/Package.resolved') }}
          restore-keys: swiftpm-linux-

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Test the refusal
        env:
          # The refusal cases are skipped on a supported release, so the run
          # names what it must have exercised and fails when it did not.
          LIBTMUX_EXPECT_REFUSAL: "1"
          VERSION: ${{ matrix.tmux }}
          CLIENT: ${{ matrix.client }}
        run: |
          export LIBTMUX_TMUX_BIN="${HOME}/tmux-${VERSION}/bin/tmux"
          export LIBTMUX_TMUX_CLIENT_BIN="${HOME}/tmux-${CLIENT}/bin/tmux"
          "$LIBTMUX_TMUX_BIN" -V
          "$LIBTMUX_TMUX_CLIENT_BIN" -V
          Scripts/swift-test --force-resolved-versions --filter VersionCheck

  test:
    name: ${{ matrix.os }} / tmux ${{ matrix.tmux }} / swift ${{ matrix.swift }}
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Real tmux, real waits: a case that parks a thread is one a Swift Testing
    # `.timeLimit` cannot cancel, so the job is the only ceiling left. The
    # slowest cell observed is under six minutes with a warm tmux cache, and a
    # cold one adds the tarball build; 30 leaves room for both and still turns
    # a hang into a failure with logs rather than six hours of silence. A tmate
    # session is a person debugging, so it gets an hour.
    timeout-minutes: ${{ matrix.tmate == 'off' && 30 || 60 }}
    strategy:
      fail-fast: false
      # Which tmux releases, and which toolchains, come from `plan`. The
      # releases the library claims to support are built from their own tags:
      # that is what makes a compatibility claim evidence rather than an
      # assertion, because behaviour differs between 3.3a, 3.4 and 3.7 on one
      # machine. Releases below the floor are the `refusal` job's. `master` is
      # built from the commit pinned in the manifest, which reports itself as
      # next-X.Y; move the pin deliberately, so an upstream break does not red
      # an unrelated change.
      matrix: ${{ fromJSON(needs.plan.outputs.test) }}

    steps:
      - uses: actions/checkout@v7

      # A release tarball never changes, so the version and the runner are the
      # whole key; anything else is keyed on the commit it resolves to.
      - name: Resolve tmux ${{ matrix.tmux }}
        id: tmux-ref
        env:
          SOURCE: ${{ matrix.source }}
          TMUX_REF: ${{ matrix.ref }}
        run: |
          python3 Scripts/tmux_ref.py resolve --source "$SOURCE" "$TMUX_REF" \
            --github-output "$GITHUB_OUTPUT"

      # Several jobs building the same releases from source is most of this
      # workflow's runtime.
      - name: Restore tmux ${{ matrix.tmux }}
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-${{ matrix.slug }}
          key: tmux-${{ steps.tmux-ref.outputs.key }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          ./Scripts/apt-get.sh update
          ./Scripts/apt-get.sh install --yes --no-install-recommends \
            automake autoconf bison libevent-dev libncurses-dev pkg-config

      - name: Build tmux ${{ matrix.tmux }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        env:
          SOURCE: ${{ matrix.source }}
          BUILD_REF: ${{ steps.tmux-ref.outputs.sha || matrix.ref }}
          SLUG: ${{ matrix.slug }}
        run: |
          python3 Scripts/tmux_ref.py build --source "$SOURCE" \
            --ref "$BUILD_REF" --prefix "$HOME/tmux-$SLUG"

      # A second, older tmux as the client, so the suite also runs a client
      # that reports another release than the daemon it talks to. tmux clients
      # and daemons speak one protocol only within a range: a 3.3a client
      # cannot talk to a 3.6 or newer daemon, so `plan` picks the client.
      - name: Restore the tmux ${{ matrix.client }} client
        id: client-cache
        if: matrix.client != ''
        uses: actions/cache@v6
        with:
          path: ~/tmux-${{ matrix.client }}
          key: tmux-${{ matrix.client }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build the tmux ${{ matrix.client }} client
        if: matrix.client != '' && steps.client-cache.outputs.cache-hit != 'true'
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          ./Scripts/apt-get.sh update
          ./Scripts/apt-get.sh install --yes --no-install-recommends \
            automake autoconf bison libevent-dev libncurses-dev pkg-config
          python3 Scripts/tmux_ref.py build --source release \
            --ref "$CLIENT" --prefix "$HOME/tmux-$CLIENT"

      # Resolving fetches five repositories on every run, and a clone that
      # times out fails a lane that has nothing wrong with it.
      - name: Restore the SwiftPM cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-linux-${{ hashFiles('Package.resolved', 'Examples/Package.resolved', 'Tools/McpSwap/Package.resolved') }}
          restore-keys: swiftpm-linux-

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      # Pinned by commit: v3.24, https://github.com/mxschmitt/action-tmate/commit/35b54af.
      # Only a dispatch gets here, and the plan allows one leg to.
      - name: Debug session before the tests
        if: github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      - name: Check formatting
        run: >-
          swift format lint --recursive --strict
          Sources Tests Examples Benchmarks
          Tools/McpSwap/Sources/McpSwapCore Tools/McpSwap/Sources/McpSwap
          Tools/McpSwap/Tests Package.swift Tools/McpSwap/Package.swift

      - name: Test the private MCP swap tool
        if: runner.os == 'Linux' && matrix.repo_checks
        run: swift test --package-path Tools/McpSwap --jobs 5 --force-resolved-versions

      - name: Check the private MCP swap C shim formatting
        if: runner.os == 'Linux' && matrix.repo_checks
        run: >-
          clang-format --dry-run --Werror
          Tools/McpSwap/Sources/CMcpSwap/mcp_swap.c
          Tools/McpSwap/Sources/CMcpSwap/include/mcp_swap.h

      # The checks below are about the repository rather than the platform, so
      # one lane runs them: the one on the newest released tmux and the pinned
      # toolchain. A missing DocC link is not a per-runner fact. The two that
      # run a tmux binary stay on the release they were written against, which
      # the whole table includes and a push does not.

      # Pinned, because the action defaults to whatever ruff released most
      # recently and lints an unchanged tree against it. 0.16.3 added a rule
      # this tooling does not satisfy and turned CI red on a commit that
      # touched no Python. Everything else here is pinned — the Swift
      # toolchain, the tmux tags, the resolved dependencies — for the reason
      # this demonstrates.
      - name: Lint the Python tooling
        if: runner.os == 'Linux' && matrix.repo_checks
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.1"
          args: check Scripts/

      # The parity manifests are data this repository ships a claim about, and
      # nothing else in CI reads them. This catches a corrupted manifest or a
      # report that stopped running.
      #
      - name: Check the parity report runs
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/parity_report.py

      - name: Test the Python tooling
        if: runner.os == 'Linux' && matrix.repo_checks
        run: |
          python3 -m pip install --quiet pytest tomlkit
          python3 -m pytest Scripts/tests -q

      # The manifests name the libtmux commit they describe, so the checkout to
      # verify against is read out of them rather than pinned twice. The parity
      # authorities are pytest files in this repository: they observe libtmux's
      # behaviour so a contract calling itself inherited has something
      # executable behind the claim, and this is where that gets run.
      - name: Check the parity manifests against libtmux
        if: runner.os == 'Linux' && matrix.version_checks
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/tmux-${SLUG}/bin:${PATH}"
          commit=$(python3 -c "import json; print(json.load(open('Parity/python-public-api.json'))['pythonSource']['commit'])")
          git clone --quiet --filter=blob:none \
            https://github.com/tmux-python/libtmux.git "${RUNNER_TEMP}/libtmux"
          git -C "${RUNNER_TEMP}/libtmux" checkout --quiet --detach "$commit"
          python3 -m pip install --quiet pytest tomlkit --editable "${RUNNER_TEMP}/libtmux"
          export LIBTMUX_PYTHON_REPO="${RUNNER_TEMP}/libtmux"
          python3 -m pytest Scripts/parity dev/Spikes/PythonTests -q
          python3 Scripts/extract-python-parity.py --check \
            --python-repo "${LIBTMUX_PYTHON_REPO}"

      # The examples package compiles every documented example, so one that no
      # longer builds fails the job below. This checks the other half: that the
      # examples on the page are the ones in the package, rather than copies
      # that drifted — and that the number of them actually run has not slid.
      - name: Check documented examples are mapped
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_examples.py --min-executed 40

      # A README link is a claim about where something lives, and a moved
      # directory or a renamed type breaks it without touching the page. This
      # reads the tree rather than the network, so a link added before the
      # documentation publishes does not fail here.
      - name: Check README links resolve
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_readme_links.py

      # AGENTS.md states the socket-namespace rule in prose; this is what makes
      # it fail rather than be remembered. `/tmp` is shared with every other
      # libtmux port on the machine.
      - name: Check every socket names this port
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_socket_namespace.py

      # A continuation nobody resumes does not fail slowly, it never returns —
      # and a `.timeLimit` cannot end it, because the limit cancels the case
      # and then waits for it. Six hours of one lane were spent that way.
      - name: Check every continuation answers cancellation
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_continuations.py

      # Ruff reports EXE001 on the runner but not locally, so the mode a file
      # was committed with is checked here too, where it can be reproduced.
      - name: Check shebanged files are executable
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_script_modes.py

      # A pin that names a version nobody tagged sends a reader nowhere, and
      # the release workflow refuses a tag this file disagrees with.
      - name: Check every version pin agrees
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_version.py

      # The tmux versions CI runs come from Scripts/tmux-matrix.json. This fails
      # when the README, the DocC pages or CONTRIBUTING say something else, or
      # when this workflow grows a list or a tmate step of its own.
      - name: Check the CI plan and the docs agree
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_ci.py

      # A changelog entry leads with an identifier, which is what makes it go
      # stale silently: a renamed symbol still reads fine on the page.
      - name: Check every changelog symbol resolves
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/check_changelog_symbols.py

      # The release notes are built from every product's changelog, so a
      # product that lost its file, its Unreleased section or its place in
      # Package.swift has to fail here rather than at the tag.
      - name: Check every product keeps its changelog
        if: runner.os == 'Linux' && matrix.repo_checks
        run: python3 Scripts/changelogs.py check

      - name: Build documentation
        if: runner.os == 'Linux' && matrix.repo_checks
        run: |
          set -euo pipefail
          : > docs.log
          for target in LibTmux TmuxWorkspace LibTmuxMCP; do
            swift package --force-resolved-versions generate-documentation \
              --target "$target" 2>&1 | tee -a docs.log
          done
          if rg -q 'warning:' docs.log; then
            echo "::error::DocC reported warnings"
            rg -A3 'warning:' docs.log
            exit 1
          fi

      # The documented process and round-trip counts are the benchmark's own
      # output. If they have drifted from what the code now does, the table is
      # wrong and saying so here is cheaper than a reader trusting it.
      - name: Check the mode matrix is current
        if: runner.os == 'Linux' && matrix.version_checks
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          export LIBTMUX_TMUX_BIN="${HOME}/tmux-${SLUG}/bin/tmux"
          python3 Scripts/update_mode_matrix.py --check

      # The trait is off by default, so this proves the configuration a consumer
      # gets without asking for anything still compiles. Resolved-version
      # enforcement keeps the tracked superset unchanged when Yams is unused.
      - name: Build with default traits
        run: swift build --force-resolved-versions

      - name: Test
        env:
          SLUG: ${{ matrix.slug }}
          CLIENT_SLUG: ${{ matrix.client_slug }}
        run: |
          # Every test resolves its tmux through this, so the whole suite runs
          # against the release being exercised rather than whatever the runner
          # happens to ship.
          export LIBTMUX_TMUX_BIN="${HOME}/tmux-${SLUG}/bin/tmux"
          export LIBTMUX_TMUX_CLIENT_BIN="${HOME}/tmux-${CLIENT_SLUG}/bin/tmux"
          "$LIBTMUX_TMUX_BIN" -V
          # The script clears TMUX, TMUX_PANE and LIBTMUX_SOCKET* and gives each
          # run its own TMUX_TMPDIR, where tmux resolves a socket *name*. Doing
          # that before the process starts keeps the fixture out of `environ`,
          # which other cases are concurrently reading.
          #
          # The examples are their own package, so the root invocation does not
          # reach them. Their resolved-version flag enforces
          # `Examples/Package.resolved` and leaves the root lock alone.
          Scripts/swift-test --package-path Examples --force-resolved-versions
          # Named rather than left to the default: the YAML reader and the six
          # tests behind it are only built when the trait is on.
          Scripts/swift-test --traits YAMLWorkspaces --force-resolved-versions

      - name: Test the staged workspace CLI
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/workspace-cli/bin/tmux-workspace"
          mkdir -p "$(dirname "$binary")"
          install -m 755 .build/debug/tmux-workspace "$binary"
          tmux="${HOME}/tmux-${SLUG}/bin/tmux"
          python3 Scripts/check_workspace_terminal.py "$binary"
          python3 Scripts/check_workspace_progress.py "$binary" "$tmux"
          python3 Scripts/check_workspace_attach.py "$binary" "$tmux"

      # `Package.resolved` tracks a superset that includes Yams even when the
      # trait is off, and a trait-off `swift test` resolves without it and
      # rewrites the file to drop that pin. Checking the committed file is what
      # catches the drift, because a run that already has it never restores it;
      # the diff beside it catches a step here rewriting the lock instead.
      - name: Check the resolved versions did not drift
        run: |
          set -euo pipefail
          jq -e '.pins[] | select(.identity == "yams")' Package.resolved > /dev/null
          git diff --exit-code Package.resolved Examples/Package.resolved

      - name: Debug session after a failure
        if: failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  # The one check that means "CI passed". Naming every leg in branch protection
  # would mean editing the rule whenever the table changes, and a leg that is
  # renamed and forgotten would stop being required without anything saying so.
  # Every job must have succeeded; `refusal` must have been skipped when the
  # plan put it out of scope.
  required:
    if: always()
    needs:
      - plan
      - refusal
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Every planned job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          REFUSAL_PLANNED: ${{ needs.plan.outputs.refusal_planned }}
        run: |
          python3 Scripts/ci_plan.py verify \
            --needs "$NEEDS" --refusal-planned "$REFUSAL_PLANNED"
