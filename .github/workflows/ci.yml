name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / tmux ${{ matrix.tmux }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The releases the library claims to support. Building each from its
        # own tag is what makes a compatibility claim evidence rather than an
        # assertion: behaviour differs between 3.2a, 3.4 and 3.7 on one machine.
        tmux: ["3.2a", "3.3a", "3.4", "3.5", "3.6", "3.7", "3.7a", "3.7b"]
        # No macOS lane: swift-subprocess calls macOS 26 API with no
        # availability guard, and SwiftPM compiles a dependency at that
        # dependency's own declared minimum, so no deployment target set here
        # reaches it. Add one once a release annotates that overload or raises
        # its own macOS minimum.

    steps:
      - uses: actions/checkout@v4

      # Sixteen jobs building the same eight releases from source, on every
      # push, is most of this workflow's runtime. A release tarball never
      # changes, so the version and the runner are the whole key.
      - name: Restore tmux ${{ matrix.tmux }}
        id: tmux-cache
        uses: actions/cache@v4
        with:
          path: ~/tmux-${{ matrix.tmux }}
          key: tmux-${{ matrix.tmux }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison libevent-dev libncurses-dev pkg-config

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS' && steps.tmux-cache.outputs.cache-hit != 'true'
        run: brew install automake bison libevent ncurses pkg-config

      - name: Build tmux ${{ matrix.tmux }}
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          configure_flags=""
          # Exported here rather than into the environment every later step
          # inherits: these point at Homebrew's copies of libevent and ncurses,
          # and nothing but tmux's configure should be reading them.
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # Keg-only formulae, so Homebrew leaves them off PATH and out of
            # pkg-config's search. tmux's configure finds neither without being
            # told, and fails in a way that reads like a missing library.
            PATH="$(brew --prefix bison)/bin:${PATH}"
            export PATH
            export PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig"
            export LDFLAGS="-L$(brew --prefix libevent)/lib -L$(brew --prefix ncurses)/lib"
            export CPPFLAGS="-I$(brew --prefix libevent)/include -I$(brew --prefix ncurses)/include"
            # From 3.7, tmux's configure refuses to guess on Darwin: it warns
            # that macOS renders complex codepoints poorly without utf8proc and
            # exits unless told which way to go. Nothing here reads a pane for
            # emoji, so the answer that keeps the lane closest to the Linux one
            # is to build without it.
            configure_flags="--disable-utf8proc"
          fi
          curl --location --fail --silent --show-error \
            "https://github.com/tmux/tmux/releases/download/${{ matrix.tmux }}/tmux-${{ matrix.tmux }}.tar.gz" \
            --output tmux.tar.gz
          tar -xzf tmux.tar.gz
          cd "tmux-${{ matrix.tmux }}"
          # shellcheck disable=SC2086 — empty on Linux, one flag on Darwin.
          ./configure --prefix="${HOME}/tmux-${{ matrix.tmux }}" $configure_flags
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests Examples Benchmarks Package.swift

      # The checks below are about the repository rather than the platform, so
      # one lane runs them. A missing DocC link is not a per-runner fact.

      # Pinned, because the action defaults to whatever ruff released most
      # recently and lints an unchanged tree against it. 0.16.3 added a rule
      # this tooling does not satisfy and turned CI red on a commit that
      # touched no Python. Everything else here is pinned — the Swift
      # toolchain, the tmux tags, the resolved dependencies — for the reason
      # this demonstrates.
      - name: Lint the Python tooling
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          args: check Scripts/

      # The parity manifests are data this repository ships a claim about, and
      # nothing else in CI reads them. This catches a corrupted manifest or a
      # report that stopped running.
      #
      - name: Check the parity report runs
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: python3 Scripts/parity_report.py

      - name: Test the Python tooling
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: |
          python3 -m pip install --quiet pytest tomlkit
          python3 -m pytest Scripts/tests -q

      # The manifests name the libtmux commit they describe, so the checkout to
      # verify against is read out of them rather than pinned twice. The parity
      # authorities are pytest files in this repository: they observe libtmux's
      # behaviour so a contract calling itself inherited has something
      # executable behind the claim, and this is where that gets run.
      - name: Check the parity manifests against libtmux
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: |
          set -euo pipefail
          export PATH="${HOME}/tmux-${{ matrix.tmux }}/bin:${PATH}"
          commit=$(python3 -c "import json; print(json.load(open('Parity/python-public-api.json'))['pythonSource']['commit'])")
          git clone --quiet --filter=blob:none \
            https://github.com/tmux-python/libtmux.git "${RUNNER_TEMP}/libtmux"
          git -C "${RUNNER_TEMP}/libtmux" checkout --quiet --detach "$commit"
          python3 -m pip install --quiet pytest tomlkit --editable "${RUNNER_TEMP}/libtmux"
          export LIBTMUX_PYTHON_REPO="${RUNNER_TEMP}/libtmux"
          python3 -m pytest Scripts/parity dev/Spikes/PythonTests -q
          python3 Scripts/extract-python-parity.py --check \
            --python-repo "${LIBTMUX_PYTHON_REPO}"

      # The examples package compiles every documented example, so one that no
      # longer builds fails the job below. This checks the other half: that the
      # examples on the page are the ones in the package, rather than copies
      # that drifted — and that the number of them actually run has not slid.
      - name: Check documented examples are compiled
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: python3 Scripts/check_examples.py --min-executed 29

      # AGENTS.md states the socket-namespace rule in prose; this is what makes
      # it fail rather than be remembered. `/tmp` is shared with every other
      # libtmux port on the machine.
      - name: Check every socket names this port
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: python3 Scripts/check_socket_namespace.py

      # Ruff reports EXE001 on the runner but not locally, so the mode a file
      # was committed with is checked here too, where it can be reproduced.
      - name: Check shebanged files are executable
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: python3 Scripts/check_script_modes.py

      # A pin that names a version nobody tagged sends a reader nowhere, and
      # the release workflow refuses a tag this file disagrees with.
      - name: Check every version pin agrees
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: python3 Scripts/check_version.py

      - name: Build documentation
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: |
          set -euo pipefail
          swift package generate-documentation --target LibTmux 2>&1 | tee docs.log
          if grep -q 'warning:' docs.log; then
            echo "::error::DocC reported warnings"
            grep -A3 'warning:' docs.log
            exit 1
          fi

      # The documented process and round-trip counts are the benchmark's own
      # output. If they have drifted from what the code now does, the table is
      # wrong and saying so here is cheaper than a reader trusting it.
      - name: Check the mode matrix is current
        if: runner.os == 'Linux' && matrix.tmux == '3.7b'
        run: |
          export LIBTMUX_TMUX_BIN="${HOME}/tmux-${{ matrix.tmux }}/bin/tmux"
          python3 Scripts/update_mode_matrix.py --check

      # The trait is off by default, so this proves the configuration a consumer
      # gets without asking for anything still compiles. It runs before the
      # suite because a default-trait resolve drops the Yams pin, and the
      # trait-on run below puts the checkout back.
      - name: Build with default traits
        run: swift build

      - name: Test
        run: |
          # Every test resolves its tmux through this, so the whole suite runs
          # against the release being exercised rather than whatever the runner
          # happens to ship.
          export LIBTMUX_TMUX_BIN="${HOME}/tmux-${{ matrix.tmux }}/bin/tmux"
          "$LIBTMUX_TMUX_BIN" -V
          # tmux resolves a socket *name* inside this, and its default is
          # shared with every other tmux on the machine. Naming it here rather
          # than having the suite set it keeps the fixture out of `environ`,
          # which other cases are concurrently reading.
          export TMUX_TMPDIR=/tmp/libtmux-swift-test/named
          mkdir -p "$TMUX_TMPDIR"
          # The examples are their own package, so the root invocation does not
          # reach them. It runs first because it resolves this package with the
          # trait on and leaves the root `Package.resolved` alone, where a
          # default-trait resolve afterwards would drop the Yams pin.
          swift test --package-path Examples
          # Named rather than left to the default: the YAML reader and the six
          # tests behind it are only built when the trait is on.
          swift test --traits YAMLWorkspaces
