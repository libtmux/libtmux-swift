name: macos-stress

# A flake is a rate, so one green run says little. This repeats the real-tmux
# suites and reports, per test, how many runs failed or were still running when
# the hang guard killed them. It is measurement, not a gate: `macos.yml` gates.
#
# One macOS job that loops, because the organisation shares a small pool of
# macOS runners and a wide matrix of repeats would starve everything else.
# The ubuntu job is the control: a test that fails on both is not about Darwin.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      repeat:
        description: Repetitions of the Examples suite per tmux release
        default: "10"
      package_repeat:
        description: Repetitions of the main package suite on tmux 3.2a
        default: "1"

concurrency:
  group: macos-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  REPEAT: ${{ inputs.repeat || '10' }}
  # The main package runs once by default, under the hang guard.
  PACKAGE_REPEAT: ${{ inputs.package_repeat || '1' }}

jobs:
  macos:
    name: macos-latest
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Restore tmux 3.2a
        id: tmux-3-2a
        uses: actions/cache@v6
        with:
          path: ~/tmux-3.2a
          key: tmux-3.2a-${{ runner.os }}-${{ runner.arch }}-utf8proc-jemalloc

      - name: Restore tmux 3.7b
        id: tmux-3-7b
        uses: actions/cache@v6
        with:
          path: ~/tmux-3.7b
          key: tmux-3.7b-${{ runner.os }}-${{ runner.arch }}-utf8proc-jemalloc

      # Unconditional: a cached tmux still loads these at run time.
      - name: Install the libraries tmux links against
        run: brew install libevent ncurses utf8proc jemalloc

      - name: Build the tmux releases that were not cached
        run: |
          set -euo pipefail
          brew install automake bison pkg-config
          PATH="$(brew --prefix bison)/bin:${PATH}"
          export PATH
          export PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig:$(brew --prefix jemalloc)/lib/pkgconfig"
          export LDFLAGS="-L$(brew --prefix libevent)/lib -L$(brew --prefix ncurses)/lib -L$(brew --prefix utf8proc)/lib -L$(brew --prefix jemalloc)/lib"
          export CPPFLAGS="-I$(brew --prefix libevent)/include -I$(brew --prefix ncurses)/include -I$(brew --prefix utf8proc)/include -I$(brew --prefix jemalloc)/include"
          for version in 3.2a 3.7b; do
            [ -x "${HOME}/tmux-${version}/bin/tmux" ] && continue
            curl --location --fail --silent --show-error \
              "https://github.com/tmux/tmux/releases/download/${version}/tmux-${version}.tar.gz" \
              --output tmux.tar.gz
            tar -xzf tmux.tar.gz
            (
              cd "tmux-${version}"
              ./configure --prefix="${HOME}/tmux-${version}" --enable-utf8proc --enable-jemalloc
              make -j"$(sysctl -n hw.ncpu)"
              make install
            )
          done

      - name: Restore the SwiftPM cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos-${{ hashFiles('Package.resolved', 'Examples/Package.resolved', 'Tools/McpSwap/Package.resolved') }}
          restore-keys: swiftpm-macos-

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Raise the pty limit
        run: sudo sysctl -w kern.tty.ptmx_max=999

      - name: Repeat the suites
        run: |
          set -euo pipefail
          export TMUX_TMPDIR=/tmp/libtmux-swift-test/named
          lanes=(
            --lane "examples:3.7b:${HOME}/tmux-3.7b/bin/tmux:examples:${REPEAT}"
            --lane "examples:3.2a:${HOME}/tmux-3.2a/bin/tmux:examples:1"
          )
          if [ "${PACKAGE_REPEAT}" != "0" ]; then
            lanes+=(--lane "package:3.2a:${HOME}/tmux-3.2a/bin/tmux:package:${PACKAGE_REPEAT}")
          fi
          python3 Scripts/stress_tests.py --out "${RUNNER_TEMP}/stress" "${lanes[@]}"

      - name: Upload counts, logs and hang samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-macos
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore

  ubuntu-control:
    name: ubuntu-latest (control)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Restore tmux 3.7b
        id: tmux-cache
        uses: actions/cache@v6
        with:
          path: ~/tmux-3.7b
          key: tmux-3.7b-${{ runner.os }}-${{ runner.arch }}

      - name: Build tmux 3.7b
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison libevent-dev libncurses-dev pkg-config
          curl --location --fail --silent --show-error \
            "https://github.com/tmux/tmux/releases/download/3.7b/tmux-3.7b.tar.gz" \
            --output tmux.tar.gz
          tar -xzf tmux.tar.gz
          cd tmux-3.7b
          ./configure --prefix="${HOME}/tmux-3.7b"
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Restore the SwiftPM cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-linux-${{ hashFiles('Package.resolved', 'Examples/Package.resolved', 'Tools/McpSwap/Package.resolved') }}
          restore-keys: swiftpm-linux-

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Repeat the suites
        run: |
          set -euo pipefail
          export TMUX_TMPDIR=/tmp/libtmux-swift-test/named
          python3 Scripts/stress_tests.py --out "${RUNNER_TEMP}/stress" \
            --lane "examples:3.7b:${HOME}/tmux-3.7b/bin/tmux:examples:${REPEAT}"

      - name: Upload counts, logs and hang samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-ubuntu
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore
